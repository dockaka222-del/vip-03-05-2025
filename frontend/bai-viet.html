<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bài viết chuyên sâu - Vipdayne.net</title>
    <meta name="description" content="Bài viết chuyên sâu từ đội ngũ Vipdayne.net." />
    <link rel="stylesheet" href="/frontend/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="navbar-logo" href="/frontend/">Vipdayne.net</a>
        <div class="navbar-menu">
          <a href="/frontend/index.html">Trang chủ</a>
          <a href="/frontend/huong-dan.html">Hướng dẫn sử dụng</a>
          <a href="/frontend/lien-he.html">Liên hệ</a>
          <a href="/frontend/gio-hang.html">Giỏ hàng</a>
          <a href="/frontend/dang-nhap.html">Đăng nhập</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <article id="post-detail" class="card"></article>
    </main>

    <footer class="footer">
      <p>&copy; <span id="current-year"></span> Vipdayne.net.</p>
    </footer>

    <script>
      document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    <script type="module">
      import { apiGetPost } from './assets/js/api.js';
      const container = document.querySelector('#post-detail');
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      if (!slug) {
        container.innerHTML = '<p>Không tìm thấy bài viết.</p>';
      } else {
        apiGetPost(slug)
          .then(({ post }) => {
            container.innerHTML = `
              <h1>${post.title}</h1>
              <p><em>Cập nhật: ${new Date(post.updatedAt).toLocaleString('vi-VN')}</em></p>
              <div>${post.content.replace(/\n/g, '<br />')}</div>
              ${post.downloadLinks
                .map((item) => `<p><a class="btn btn-secondary" href="${item.url}">${item.label}</a></p>`)
                .join('')}
            `;
          })
          .catch((error) => {
            container.innerHTML = `<p>${error.message}</p>`;
          });
      }
    </script>
  </body>
</html>
