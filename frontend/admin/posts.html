<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý bài viết - Vipdayne.net</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/frontend/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="navbar-logo" href="/frontend/">Vipdayne.net</a>
        <div class="navbar-menu">
          <a href="/frontend/admin/index.html">Dashboard</a>
          <a href="/frontend/admin/users.html">Người dùng</a>
          <a href="/frontend/admin/orders.html">Đơn hàng</a>
          <a href="/frontend/admin/coupons.html">Mã giảm giá</a>
          <a href="/frontend/admin/posts.html">Bài viết</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div id="feedback"></div>
      <section class="card">
        <h1>Tạo bài viết mới</h1>
        <form id="post-form" class="grid" style="gap: 12px">
          <input type="text" name="title" placeholder="Tiêu đề" required />
          <input type="text" name="slug" placeholder="Slug (tuỳ chọn)" />
          <textarea name="excerpt" placeholder="Tóm tắt" rows="2"></textarea>
          <textarea name="content" placeholder="Nội dung chính" rows="6" required></textarea>
          <textarea name="downloadLinks" placeholder="Nhập dạng Tiêu đề|URL mỗi dòng" rows="4"></textarea>
          <button class="btn btn-primary" type="submit">Xuất bản</button>
        </form>
      </section>
    </main>

    <script type="module" src="/frontend/assets/js/admin.js"></script>
  </body>
</html>
