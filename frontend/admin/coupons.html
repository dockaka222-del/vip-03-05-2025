<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý mã giảm giá - Vipdayne.net</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="/frontend/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="navbar-logo" href="/frontend/">Vipdayne.net</a>
        <div class="navbar-menu">
          <a href="/frontend/admin/index.html">Dashboard</a>
          <a href="/frontend/admin/users.html">Người dùng</a>
          <a href="/frontend/admin/orders.html">Đơn hàng</a>
          <a href="/frontend/admin/coupons.html">Mã giảm giá</a>
          <a href="/frontend/admin/posts.html">Bài viết</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div id="feedback"></div>
      <section class="card">
        <h1>Tạo mã giảm giá</h1>
        <form id="coupon-form" class="grid" style="gap: 12px">
          <input type="text" name="code" placeholder="Mã" required />
          <select name="type">
            <option value="percent">Theo %</option>
            <option value="amount">Theo số tiền</option>
          </select>
          <input type="number" name="value" placeholder="Giá trị" min="1" required />
          <input type="number" name="maxUsage" placeholder="Số lần sử dụng (0 = không giới hạn)" min="0" />
          <input type="date" name="expiresAt" />
          <textarea name="note" placeholder="Ghi chú" rows="2"></textarea>
          <button class="btn btn-primary" type="submit">Tạo mã</button>
        </form>
      </section>
      <section id="coupon-list" class="card" style="margin-top: 24px"></section>
    </main>

    <script type="module" src="/frontend/assets/js/admin.js"></script>
  </body>
</html>
