<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng ký - Vipdayne.net</title>
    <meta name="description" content="Tạo tài khoản Vipdayne.net để mua sản phẩm số chuẩn production." />
    <link rel="stylesheet" href="/frontend/assets/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a class="navbar-logo" href="/frontend/">Vipdayne.net</a>
        <div class="navbar-menu">
          <a href="/frontend/index.html">Trang chủ</a>
          <a href="/frontend/huong-dan.html">Hướng dẫn sử dụng</a>
          <a href="/frontend/lien-he.html">Liên hệ</a>
          <a href="/frontend/gio-hang.html">Giỏ hàng</a>
          <a href="/frontend/dang-nhap.html">Đăng nhập</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="form-card">
        <h1>Đăng ký tài khoản</h1>
        <div id="feedback"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="name">Họ tên</label>
            <input id="name" name="name" type="text" placeholder="Nguyễn Văn A" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
          </div>
          <button class="btn btn-primary" type="submit">Tạo tài khoản</button>
        </form>
        <p>Đã có tài khoản? <a href="/frontend/dang-nhap.html">Đăng nhập</a></p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; <span id="current-year"></span> Vipdayne.net.</p>
    </footer>

    <script>
      document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    <script type="module" src="/frontend/assets/js/register.js"></script>
  </body>
</html>
